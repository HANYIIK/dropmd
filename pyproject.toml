[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dropmd-desktop"
version = "1.5.0"
description = "Drop local documents and convert them to Markdown beside the source file."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.8,<7",
  "beautifulsoup4",
  "charset-normalizer",
  "defusedxml",
  "lxml",
  "magika~=0.6.1",
  "mammoth~=1.11.0",
  "markdownify",
  "olefile",
  "openpyxl>=3.1,<4",
  "pandas",
  "pdfminer.six>=20251230",
  "pdfplumber>=0.11.9",
  "python-pptx",
  "requests",
  "xlrd",
]

[project.optional-dependencies]
build = [
  "dmgbuild>=1.6,<2; platform_system == 'Darwin'",
  "Pillow>=11,<13",
  "pyinstaller>=6.11,<7",
]
test = ["pytest>=8,<9"]

[project.gui-scripts]
dropmd = "dropmd.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
